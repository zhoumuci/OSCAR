services:
  oscar-backend:
    build:
      context: ./database_backend
      dockerfile: Dockerfile
    container_name: oscar-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BEDTOOLS_BIN: /usr/bin/bedtools
      OSCAR_RESOURCE_ROOT: /data/oscar
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      - ${OSCAR_RESOURCE_HOST}:/data/oscar