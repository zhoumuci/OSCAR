server:
  port: 8080

spring:
  application:
    name: oscar-backend

  datasource:
    url: jdbc:mysql://localhost:3306/oscar?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: oscar_user
    password: oscar_password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.oscar.backend.entity
  configuration:
    map-underscore-to-camel-case: true

oscar:
  resource-root: ${OSCAR_RESOURCE_ROOT:/data/oscar}
  bedtools:
    reference-root: ${OSCAR_BEDTOOLS_REFERENCE_ROOT:${oscar.resource-root}/reference}
    sample-track-root: ${OSCAR_BEDTOOLS_SAMPLE_TRACK_ROOT:${oscar.resource-root}/sample_tracks}
    tmp-root: ${OSCAR_BEDTOOLS_TMP_ROOT:${oscar.resource-root}/tmp/bedtools}
    binary-path: ${OSCAR_BEDTOOLS_BINARY:/usr/bin/bedtools}
    max-region-bp: ${OSCAR_BEDTOOLS_MAX_REGION_BP:5000000}
    timeout-seconds: ${OSCAR_BEDTOOLS_TIMEOUT_SECONDS:120}
